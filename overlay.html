<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 순위 오버레이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --card:rgba(20,26,43,.92); --panel:rgba(14,20,32,.9); --line:rgba(255,255,255,.09);
    --text:#F2F4F9; --muted:#8A93A8; --dim:#616C85; --edge:rgba(255,255,255,.11);
    --gold:#FFD166; --cut:#7C8CFF; --ok:#5FD3A0; --warn:#FF8A78; --me:#FFD166;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;overflow:hidden;}
  body{
    color:var(--text);padding:10px;
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .box{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.42);
  }
  body.flat .box{box-shadow:none;}
  body.clear .box{border-color:rgba(255,255,255,.16);}

  /* 설정 (마우스를 움직여야 나타납니다 — OBS에서는 안 보입니다) */
  .gear{position:fixed;top:12px;right:12px;z-index:20;
    width:30px;height:30px;border-radius:9px;cursor:pointer;
    background:rgba(20,26,43,.9);border:1px solid rgba(255,255,255,.14);
    color:#8A93A8;font-size:15px;line-height:28px;text-align:center;
    opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .gear.show{opacity:1;pointer-events:auto;}
  .gear:hover{color:#F2F4F9;}
  .panel{position:fixed;top:50px;right:12px;z-index:21;display:none;width:250px;
    background:rgba(16,21,35,.97);border:1px solid rgba(255,255,255,.14);
    border-radius:13px;padding:15px 16px;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .panel.on{display:block;}
  .panel h3{margin:0 0 11px;font-size:12.5px;font-weight:800;color:#F2F4F9;letter-spacing:-.02em;}
  .panel .lab{display:flex;align-items:baseline;justify-content:space-between;
    font-size:11px;font-weight:700;color:#8A93A8;margin-bottom:6px;}
  .panel .lab b{color:#FFD166;font-variant-numeric:tabular-nums;}
  .panel input[type=range]{width:100%;accent-color:#FFD166;margin:0 0 12px;}
  .quick{display:flex;gap:6px;margin-bottom:13px;}
  .quick button{flex:1;font:inherit;font-size:11px;font-weight:700;color:#8A93A8;
    background:rgba(43,52,80,.7);border:1px solid rgba(255,255,255,.1);
    border-radius:8px;padding:7px 0;cursor:pointer;}
  .quick button:hover{color:#F2F4F9;}
  .panel .cp{width:100%;font:inherit;font-size:11.5px;font-weight:800;color:#0A0D16;
    background:#FFD166;border:0;border-radius:9px;padding:9px 0;cursor:pointer;}
  .panel .note{margin-top:9px;font-size:10.5px;color:#616C85;line-height:1.65;}
  .top{
    display:flex;align-items:center;gap:9px;padding:11px 15px 10px;
    border-bottom:1px solid var(--line);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;
    animation:blink 1.9s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .top b{font-size:14px;font-weight:800;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top span{margin-left:auto;flex:none;font-size:11px;font-weight:700;color:var(--dim);
    font-variant-numeric:tabular-nums;}

  .row{
    display:grid;grid-template-columns:44px 40px minmax(0,1fr) auto;
    align-items:center;gap:10px;padding:9px 15px;height:58px;
    border-bottom:1px solid rgba(255,255,255,.04);
    transition:transform .55s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .row:last-child{border-bottom:none;}
  .rk{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .rk .n{font-size:19px;font-weight:800;font-style:italic;line-height:1;
    font-variant-numeric:tabular-nums;}
  .rk .mv{font-size:9.5px;font-weight:800;line-height:1;}
  .mv.u{color:var(--ok);} .mv.d{color:var(--warn);} .mv.nw{color:var(--cut);}
  .row.r1 .rk .n{color:var(--gold);}
  .row.r2 .rk .n{color:#D7DEF0;}
  .row.r3 .rk .n{color:#E0A177;}

  .pic{position:relative;width:38px;height:38px;border-radius:50%;overflow:hidden;
    background:#212940;border:1px solid var(--edge);flex:none;}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .pic .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--muted);}

  .nm{font-size:15px;font-weight:700;letter-spacing:-.02em;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up{display:flex;align-items:baseline;gap:6px;flex:none;}
  .up .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .up .u{font-size:10px;font-weight:800;color:var(--dim);}
  .up .d{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;min-width:30px;}
  .up .d.p{color:var(--ok);} .up .d.m{color:var(--warn);}

  /* 나 */
  .row.me{background:linear-gradient(90deg,rgba(255,209,102,.16),rgba(255,209,102,.05));
    box-shadow:inset 3px 0 0 var(--me);}
  .row.me .nm{color:var(--me);font-weight:800;}
  .row.me .up .v{color:var(--me);}

  /* 확정선 */
  .cut{display:flex;align-items:center;gap:9px;padding:6px 15px;
    background:rgba(124,140,255,.09);
    border-top:1px solid rgba(124,140,255,.32);border-bottom:1px solid rgba(124,140,255,.32);}
  .cut span{font-size:10.5px;font-weight:800;color:var(--cut);letter-spacing:.04em;}
  .cut i{flex:1;height:1px;background:rgba(124,140,255,.25);}
  .cut.hot{background:rgba(255,209,102,.11);
    border-top-color:rgba(255,209,102,.45);border-bottom-color:rgba(255,209,102,.45);}
  .cut.hot span{color:var(--gold);}
  .cut.hot i{background:rgba(255,209,102,.3);}

  .foot{display:flex;align-items:center;gap:10px;padding:9px 15px;
    border-top:1px solid var(--line);background:var(--panel);}
  .foot .g{font-size:11.5px;font-weight:700;color:var(--muted);}
  .foot .g b{color:var(--text);font-variant-numeric:tabular-nums;}
  .foot .g.safe b{color:var(--ok);}
  .foot .g.risk b{color:var(--warn);}
  .foot .r{margin-left:auto;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;}

  .msg{padding:26px 18px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.8;}
  .msg.err{color:var(--warn);white-space:pre-wrap;}
</style>
</head>
<body>
<div class="gear" id="gear" title="배경 진하기">⚙</div>
<div class="panel" id="panel">
  <h3>배경 진하기</h3>
  <div class="lab"><span>불투명도</span><b id="bgVal">92%</b></div>
  <input type="range" id="bgRange" min="0" max="100" step="1" value="92">
  <div class="quick">
    <button data-bg="0">완전 투명</button>
    <button data-bg="55">반투명</button>
    <button data-bg="100">불투명</button>
  </div>
  <button class="cp" id="bgCopy">이 설정이 담긴 주소 복사</button>
  <div class="note">복사한 주소를 OBS에 넣으면 이 설정 그대로 뜹니다.</div>
</div>

<div class="box" id="box">
  <div class="top"><span class="dot"></span><b id="ttl">내 순위</b><span id="clock"></span></div>
  <div id="list"><div class="msg">불러오는 중입니다…</div></div>
</div>

<script>
(function(){
  'use strict';
  var $=function(i){return document.getElementById(i);};
  var P=new URLSearchParams(location.search);

  /* ===== 내 중계기 주소 (바뀌면 여기만 고치세요) ===== */
  var RELAY='https://tired-echidna-4498.soop-up-site-collection.deno.net/list';
  /* ================================================= */

  var S={ id:'', no:'', me:'', around:2, cut:0, interval:10, bg:92,
          groups:[], relay:RELAY, items:[], prev:null, busy:false, err:'' };

  /* ---------- 배경 진하기 ---------- */
  function paintBg(v){
    S.bg=Math.max(0,Math.min(100,Number(v)||0));
    var a=S.bg/100;
    var root=document.documentElement.style;
    root.setProperty('--card','rgba(20,26,43,'+a.toFixed(3)+')');
    root.setProperty('--panel','rgba(14,20,32,'+a.toFixed(3)+')');
    root.setProperty('--line','rgba(255,255,255,'+(0.05+a*0.06).toFixed(3)+')');
    document.body.classList.toggle('flat',S.bg<25);
    document.body.classList.toggle('clear',S.bg<25);
    $('bgRange').value=S.bg;
    $('bgVal').textContent=S.bg+'%';
  }
  function myUrl(){
    var q=new URLSearchParams(location.search);
    q.set('bg',String(S.bg));
    return location.origin+location.pathname+'?'+q.toString();
  }
  $('bgRange').addEventListener('input',function(){ paintBg(this.value); });
  document.querySelectorAll('.quick button').forEach(function(b){
    b.addEventListener('click',function(){ paintBg(b.getAttribute('data-bg')); });
  });
  $('bgCopy').addEventListener('click',function(){
    var u=myUrl();
    if(navigator.clipboard)navigator.clipboard.writeText(u);
    $('bgCopy').textContent='복사됐습니다';
    setTimeout(function(){ $('bgCopy').textContent='이 설정이 담긴 주소 복사'; },1500);
  });
  $('gear').addEventListener('click',function(){ $('panel').classList.toggle('on'); });

  // 마우스를 움직이면 톱니가 나타나고, 가만히 있으면 사라집니다.
  // OBS는 마우스가 없으니 방송 화면에는 안 나옵니다.
  var hideAt=null;
  function wake(){
    $('gear').classList.add('show');
    clearTimeout(hideAt);
    hideAt=setTimeout(function(){
      if(!$('panel').classList.contains('on'))$('gear').classList.remove('show');
    },3000);
  }
  document.addEventListener('mousemove',wake);
  document.addEventListener('touchstart',wake);
  wake();

  /* ---------- 설정 읽기 ---------- */
  function parsePost(u){
    var s=String(u||'').trim();
    var m=s.match(/\/station\/([^/?#]+)\/(?:post|board)\/(\d+)/);
    if(m)return {id:m[1],no:m[2]};
    m=s.match(/^([A-Za-z0-9_-]+)[\/:](\d+)$/);
    return m?{id:m[1],no:m[2]}:null;
  }
  function parseGroups(v){
    var out=[];
    String(v||'').split('|').forEach(function(part){
      var p=part.split('~'), name=(p[0]||'').trim();
      if(!name)return;
      out.push({name:name, keys:(p[1]||p[0]).split(',').map(function(x){return x.trim();}).filter(Boolean)});
    });
    return out;
  }
  function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,''); }
  function hit(t,g){ t=norm(t); if(!t)return false;
    for(var i=0;i<g.keys.length;i++){var k=norm(g.keys[i]); if(k&&t.indexOf(k)>=0)return true;} return false; }
  function starts(t,g){ t=norm(t); if(!t)return false;
    for(var i=0;i<g.keys.length;i++){var k=norm(g.keys[i]); if(k&&t.indexOf(k)===0)return true;} return false; }
  function classify(r){
    var G=S.groups,i;
    if(!G.length)return -1;
    for(i=0;i<G.length;i++) if(starts(r.ptxt,G[i])) return i;
    for(i=0;i<G.length;i++) if(starts(r.txt ,G[i])) return i;
    for(i=0;i<G.length;i++) if(hit(r.ptxt,G[i])) return i;
    for(i=0;i<G.length;i++) if(hit(r.txt ,G[i])) return i;
    return -1;
  }
  var _dec=document.createElement('textarea');
  function unesc(v){
    var t=String(v||'');
    if(t.indexOf('&')<0)return t;
    for(var i=0;i<2;i++){ _dec.innerHTML=t; var n=_dec.value; if(n===t)break; t=n; }
    return t;
  }

  function apply(src){
    var p=parsePost(src.p||src.post);
    if(p){S.id=p.id;S.no=p.no;}
    S.me=String(src.me||'').trim().toLowerCase();
    S.around=Math.max(1,Math.min(10,Number(src.around||src.a||2)));
    S.cut = (src.c===0||src.c==='0') ? 0 : (Number(src.c||src.cut||0)||0);
    S.interval=Math.max(5,Number(src.i||src.interval||10));
    S.groups=parseGroups(src.g||src.groups);
    S.relay=src.r||src.relay||RELAY;
    paintBg(src.bg!=null&&src.bg!=='' ? src.bg : 92);
    if(src.t||src.title)$('ttl').textContent=src.t||src.title;
    if(S.timer)clearInterval(S.timer);
    if(S.id){ load(); S.timer=setInterval(load,S.interval*1000); }
  }

  /* ---------- 가져오기 ---------- */
  function listUrl(){
    var b=S.relay.replace(/\/+$/,'');
    if(!/\/list$/.test(b))b+='/list';
    return b+'?id='+encodeURIComponent(S.id.toLowerCase())+'&no='+encodeURIComponent(S.no)+'&t='+Date.now();
  }
  function load(){
    if(!S.id||S.busy)return;
    S.busy=true;
    var to=setTimeout(function(){ if(S.busy){S.busy=false;} },35000);
    fetch(listUrl(),{cache:'no-store',credentials:'omit',headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok&&r.status!==502)throw new Error('서버 '+r.status); return r.json(); })
      .then(function(j){
        if(j&&j.error)throw new Error(j.error);
        var rows=(j&&j.items)||[];
        rows.forEach(function(r){ r.nick=unesc(r.nick); r.txt=unesc(r.txt); r.ptxt=unesc(r.ptxt); });
        rows.sort(function(a,b){return b.up-a.up;});
        if(S.groups.length){
          var n={};
          rows.forEach(function(r){ r.grp=classify(r); n[r.grp]=(n[r.grp]||0)+1; r.rank=n[r.grp]; });
        }else{
          rows.forEach(function(r,i){ r.grp=-1; r.rank=i+1; });
        }
        var prev=S.prev;
        rows.forEach(function(r){
          var p=prev?prev[r.key]:null;
          r.isNew=!!(prev&&!p);
          r.dUp=p?(r.up-p.up):0;
          r.dRank=p?(p.rank-r.rank):0;
        });
        var snap={};
        rows.forEach(function(r){ snap[r.key]={up:r.up,rank:r.rank}; });
        S.prev=snap; S.items=rows; S.err='';
        S.at=j&&j.updated?new Date(j.updated):new Date();
        draw();
      })
      .catch(function(e){
        var m=e.message||String(e);
        if(/Failed to fetch|NetworkError|load failed/i.test(m))m='중계기에 연결하지 못했습니다.';
        if(S.items.length)return;      // 이미 띄운 순위는 그대로 둔다
        S.err=m; draw();
      })
      .then(function(){ clearTimeout(to); S.busy=false; },function(){ clearTimeout(to); S.busy=false; });
  }

  /* ---------- 그리기 ---------- */
  function findMe(){
    if(!S.me)return null;
    var i;
    for(i=0;i<S.items.length;i++) if(String(S.items[i].uid||'').toLowerCase()===S.me) return S.items[i];
    for(i=0;i<S.items.length;i++) if(norm(S.items[i].nick)===norm(S.me)) return S.items[i];
    return null;
  }
  function draw(){
    var list=$('list');
    if(S.err){ list.innerHTML='<div class="msg err">'+S.err+'</div>'; return; }
    if(!S.items.length){ list.innerHTML='<div class="msg">아직 지원자가 없습니다.</div>'; return; }

    var me=findMe();
    if(!me){
      list.innerHTML='<div class="msg">목록에서 나를 찾지 못했습니다.<br>주소의 me 값이 SOOP 아이디와 같은지 확인해주세요.</div>';
      return;
    }
    var band=S.groups.length ? S.items.filter(function(r){return r.grp===me.grp;}) : S.items.slice();
    var at=band.indexOf(me);
    var from=Math.max(0,at-S.around);
    var to=Math.min(band.length,from+S.around*2+1);
    from=Math.max(0,to-(S.around*2+1));
    var view=band.slice(from,to);

    // 자리 기억
    var old={};
    var cur=list.querySelectorAll('.row');
    for(var i=0;i<cur.length;i++){
      var k=cur[i].getAttribute('data-key');
      if(k)old[k]=cur[i].getBoundingClientRect().top;
    }

    list.innerHTML='';
    var cutDrawn=false;
    view.forEach(function(r){
      if(S.cut>0 && !cutDrawn && r.rank>S.cut){
        cutDrawn=true;
        var gapAt=null;
        for(var q=0;q<band.length;q++){ if(band[q].rank===S.cut)gapAt=band[q]; }
        var close=false, gap=0;
        if(gapAt){
          var below=null;
          for(var q2=0;q2<band.length;q2++){ if(band[q2].rank===S.cut+1)below=band[q2]; }
          if(below){ gap=gapAt.up-below.up;
            var mid=(gapAt.up+below.up)/2;
            close = gap<=Math.max(1,Math.min(100,Math.round(mid*0.005))); }
        }
        var c=document.createElement('div');
        c.className='cut'+(close?' hot':'');
        c.innerHTML='<i></i><span>'+(close?'접전 · 여기까지 '+S.cut+'명':'여기까지 '+S.cut+'명 확정')+'</span><i></i>';
        list.appendChild(c);
      }

      var el=document.createElement('div');
      el.className='row'+(r===me?' me':'')+
        (r.rank===1?' r1':r.rank===2?' r2':r.rank===3?' r3':'');
      el.setAttribute('data-key',r.key);
      el.innerHTML=
        '<div class="rk"><div class="n"></div></div>'+
        '<div class="pic"><span class="ini"></span></div>'+
        '<div class="nm"></div>'+
        '<div class="up"><span class="v"></span><span class="u">UP</span><span class="d"></span></div>';
      el.querySelector('.n').textContent=r.rank;
      if(r.isNew||r.dRank){
        var mv=document.createElement('div');
        mv.className='mv '+(r.isNew?'nw':r.dRank>0?'u':'d');
        mv.textContent=r.isNew?'NEW':(r.dRank>0?'\u25B2'+r.dRank:'\u25BC'+(-r.dRank));
        el.querySelector('.rk').appendChild(mv);
      }
      el.querySelector('.ini').textContent=r.nick.slice(0,1);
      if(r.img){
        var im=document.createElement('img');
        im.referrerPolicy='no-referrer'; im.alt='';
        im.onerror=function(){ if(im.parentNode)im.parentNode.removeChild(im); };
        im.src=r.img;
        el.querySelector('.pic').appendChild(im);
      }
      el.querySelector('.nm').textContent=r.nick;
      el.querySelector('.v').textContent=r.up.toLocaleString('ko-KR');
      var d=el.querySelector('.d');
      if(r.dUp>0){ d.className='d p'; d.textContent='+'+r.dUp.toLocaleString('ko-KR'); }
      else if(r.dUp<0){ d.className='d m'; d.textContent=r.dUp.toLocaleString('ko-KR'); }
      list.appendChild(el);
    });

    // 아래 요약
    var foot=document.createElement('div');
    foot.className='foot';
    var up=null, down=null;
    if(at>0)up=band[at-1];
    if(at<band.length-1)down=band[at+1];
    var txt='';
    if(up)txt+='앞사람까지 <b>'+(up.up-me.up).toLocaleString('ko-KR')+'</b> UP';
    if(up&&down)txt+=' · ';
    if(down)txt+='뒷사람과 <b>'+(me.up-down.up).toLocaleString('ko-KR')+'</b> UP';
    if(!txt)txt='<b>'+me.rank+'위</b>';
    var cls='g';
    if(S.cut>0){ cls += (me.rank<=S.cut) ? ' safe' : ' risk'; }
    foot.innerHTML='<div class="'+cls+'">'+txt+'</div><div class="r"></div>';
    foot.querySelector('.r').textContent=
      (S.groups.length&&S.groups[me.grp]?S.groups[me.grp].name+' · ':'')+band.length+'명';
    list.appendChild(foot);

    // 원래 자리에서 미끄러져 오도록
    var now=list.querySelectorAll('.row');
    for(var j=0;j<now.length;j++){
      var e2=now[j], k2=e2.getAttribute('data-key');
      if(!k2||!(k2 in old))continue;
      var gapY=old[k2]-e2.getBoundingClientRect().top;
      if(Math.abs(gapY)<2)continue;
      e2.style.transition='none';
      e2.style.transform='translateY('+gapY+'px)';
    }
    list.offsetHeight;
    requestAnimationFrame(function(){
      for(var j2=0;j2<now.length;j2++){
        if(!now[j2].style.transform)continue;
        now[j2].style.transition='transform .55s cubic-bezier(.22,.61,.36,1)';
        now[j2].style.transform='';
      }
    });

    $('clock').textContent=S.at?S.at.toLocaleTimeString('ko-KR'):'';
  }

  /* ---------- 시작 ---------- */
  var slug=P.get('s');
  if(slug){
    fetch('presets.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok)throw new Error('presets.json 을 읽지 못했습니다.'); return r.json(); })
      .then(function(all){
        var c=all&&all[slug];
        if(!c)throw new Error('"'+slug+'" 설정이 presets.json 안에 없습니다.');
        c=Object.assign({},c);
        ['me','a','around','i','t','bg'].forEach(function(k){ if(P.get(k)!=null)c[k]=P.get(k); });
        apply(c);
      })
      .catch(function(e){ S.err=e.message||String(e); draw(); });
  }else{
    var o={};
    P.forEach(function(v,k){ o[k]=v; });
    if(!o.p&&!o.post){
      paintBg(o.bg!=null?o.bg:92);
      $('list').innerHTML='<div class="msg">주소에 설정이 없습니다.<br>순위 페이지에서 오버레이 주소를 만들어 사용해주세요.</div>';
    }else apply(o);
  }
})();
</script>
</body>
</html>
