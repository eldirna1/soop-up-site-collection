<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연결 시험</title>
<style>
  body{margin:0;padding:28px 20px 70px;background:#0A0D16;color:#F2F4F9;
    font-family:Pretendard,-apple-system,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;}
  h1{margin:0 0 6px;font-size:24px;font-weight:900;letter-spacing:-.03em;}
  p.t{margin:0 0 20px;font-size:13px;color:#8A93A8;line-height:1.8;}
  .f{margin-bottom:11px;}
  label{display:block;font-size:11.5px;font-weight:700;color:#8A93A8;margin-bottom:5px;}
  input{font:inherit;font-size:13px;color:#F2F4F9;background:#0E1420;border:1px solid #252E44;
    border-radius:9px;padding:9px 11px;width:100%;box-sizing:border-box;}
  button{font:inherit;font-size:13px;font-weight:700;color:#0A0D16;background:#7C8CFF;
    border:0;border-radius:9px;padding:11px 20px;cursor:pointer;margin-top:4px;}
  pre{background:#0E1420;border:1px solid #252E44;border-radius:11px;padding:15px 16px;
    font-size:12px;line-height:1.8;white-space:pre-wrap;word-break:break-all;
    color:#8A93A8;margin-top:16px;min-height:80px;}
  .ok{color:#5FD3A0;} .no{color:#FF9A8B;}
</style>
</head>
<body>
<div class="wrap">
  <h1>연결 시험</h1>
  <p class="t">이 페이지에서 SOOP에 직접 물어보고, 결과를 그대로 보여줍니다.<br>
     중계기가 정말 필요한지 여기서 판정됩니다.</p>

  <div class="f">
    <label>게시글 주소</label>
    <input id="u" value="https://www.sooplive.com/station/ecvhao/post/203249055">
  </div>
  <button id="go">시험 시작</button>

  <pre id="out">아직 시험하지 않았습니다.</pre>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var log=function(s,cls){
    var e=$('out');
    e.innerHTML+=(e.innerHTML?'\n':'')+(cls?'<span class="'+cls+'">'+s+'</span>':s);
  };

  $('go').addEventListener('click',function(){
    $('out').innerHTML='';
    var m=$('u').value.match(/\/station\/([^/?#]+)\/(?:post|board)\/(\d+)/);
    if(!m){ log('게시글 주소를 알아볼 수 없습니다.','no'); return; }

    var api='https://api-channel.sooplive.com/v1.1/channel/'+m[1]+
            '/post/'+m[2]+'/comment?page=1&orderBy=reg_date&cCommentNo=0';

    log('이 페이지 주소: '+location.origin);
    log('요청할 주소: '+api);
    log('');
    log('보내는 중…');

    var t0=Date.now(), done=false;
    setTimeout(function(){
      if(!done)log('\n15초가 지났는데 아직 아무 응답이 없습니다.\n→ SOOP이 응답을 안 주고 있습니다. 중계기가 필요합니다.','no');
    },15000);

    fetch(api,{credentials:'omit'})
      .then(function(r){
        done=true;
        log('\n응답 받음! ('+(Date.now()-t0)+'ms)','ok');
        log('상태 번호: '+r.status+' '+r.statusText);
        return r.text();
      })
      .then(function(txt){
        log('받은 길이: '+txt.length.toLocaleString()+'자');
        log('');
        log('=== 결과: 중계기 없이 됩니다 ===','ok');
        log('');
        log('앞부분 300자:');
        log(txt.slice(0,300));
      })
      .catch(function(e){
        done=true;
        log('\n실패했습니다. ('+(Date.now()-t0)+'ms)','no');
        log('오류 내용: '+(e&&e.message||String(e)));
        log('');
        log('=== 결과: 중계기가 필요합니다 ===','no');
        log('');
        log('브라우저가 막았거나, SOOP이 응답을 거부한 것입니다.');
        log('F12 → Console 탭에 더 자세한 빨간 글씨가 있으면 그것도 알려주세요.');
      });
  });
})();
</script>
</body>
</html>
